name: Publish to the Snap Store

on:
  workflow_call:

permissions:
  contents: read

jobs:
  snap:
    name: Snap Store stable
    concurrency: joomengine-snap-stable
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') && vars.SNAP_STORE_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: distribution
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the public release Snap
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(packaging/publish/release-file.sh '*.snap')
          echo "path=$file" >> "$GITHUB_OUTPUT"
          python3 packaging/publish/snap-status.py "$file" >> "$GITHUB_OUTPUT"
      - name: Install Store and desktop test tools
        if: steps.asset.outputs.promote == 'true'
        run: |
          .github/scripts/install-linux-build-deps.sh dbus-user-session
          sudo snap install --classic snapcraft
      - name: Upload the tested release to latest/candidate
        if: steps.asset.outputs.upload == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          RELEASE_SNAP: ${{ steps.asset.outputs.path }}
        run: snapcraft upload "$RELEASE_SNAP" --release=latest/candidate
      - name: Install from the Store and launch with automatic connections
        if: steps.asset.outputs.promote == 'true'
        id: candidate
        env:
          RELEASE_SNAP: ${{ steps.asset.outputs.path }}
        run: packaging/publish/check-snap-candidate.sh "$RELEASE_SNAP"
      - name: Promote the verified Store revision to latest/stable
        if: steps.asset.outputs.promote == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: snapcraft release joomengine "$REVISION" latest/stable
