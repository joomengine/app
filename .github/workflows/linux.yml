name: Native Linux packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  archive:
    name: Linux Qt WebEngine archive (x64)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and display dependencies
        run: .github/scripts/install-linux-build-deps.sh qt6-base-dev qt6-webengine-dev libqt6webenginecore6-bin qt6-qpa-plugins dbus-x11
      - name: Build the release and native QA binaries
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target joomengine --parallel
          cmake -S . -B build-qa -DCMAKE_BUILD_TYPE=Release -DJOOMENGINE_NATIVE_QA=ON
          cmake --build build-qa --target joomengine --parallel
      - name: Install and launch the release archive
        run: |
          bash scripts/package-linux.sh
          unpack=$(mktemp -d)
          tar -xzf dist/packages/*.tar.gz -C "$unpack"
          "$unpack"/JoomEngine-*/install.sh
          dbus-run-session -- xvfb-run -a scripts/check-linux-window.sh "$HOME/.local/bin/joomengine"
      - name: Exercise hosted JCB in Qt WebEngine
        run: dbus-run-session -- xvfb-run -a python3 test/native_smoke.py --native-file-chooser build-qa/joomengine
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/packages/*.tar.gz
          if-no-files-found: error

  snap:
    name: Build strict Qt WebEngine Snap (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies on the disposable core24-compatible VM
        run: |
          .github/scripts/install-linux-build-deps.sh dbus-user-session libgl-dev libegl-dev libopengl-dev libxkbcommon-dev libvulkan-dev
          sudo snap install --classic snapcraft
      - name: Build both executables with the KDE Qt SDK
        run: bash .github/scripts/build-qt-snap-binaries.sh
      - name: Package the release and instrumented test Snap
        run: |
          bash scripts/prepare-snap.sh
          mkdir -p dist/packages dist/qa-snap
          version=$(cat VERSION)
          # This hosted Ubuntu VM matches the core24 base. Build directly on
          # the disposable runner without downloading a separate LXD OS image.
          output="joomengine_${version}_amd64.snap"
          set -o pipefail
          (cd dist/snap-project && sudo snapcraft pack --destructive-mode --output="$output") 2>&1 | tee "$RUNNER_TEMP/snapcraft.log"
          # Snapcraft checks ELF dependencies recursively against the effective
          # stage, base and content runtime, where the host's libraries cannot help.
          if grep -F "missing dependency '" "$RUNNER_TEMP/snapcraft.log"; then exit 1; fi
          install -m 0644 "dist/snap-project/$output" dist/packages/
          # Keep the release output pristine. The second local Snap exercises
          # the same filesystem, native runtime and confinement with QA enabled.
          sudo install -m 0755 build-qa/joomengine dist/snap-project/prime/usr/bin/joomengine
          sudo snap pack dist/snap-project/prime dist/qa-snap
          packaging/linux/build-snap-installer.sh "dist/packages/$output" dist/packages/joomengine-install-snap.sh
          packaging/linux/build-snap-installer.sh "dist/qa-snap/$output" dist/qa-snap/joomengine-install-snap.sh
      - name: Read file chooser settings from the packaged Snap with host schemas hidden
        run: |
          schemas=$(mktemp -d)
          unsquashfs -cat dist/packages/*.snap usr/share/glib-2.0/schemas/gschemas.compiled > "$schemas/gschemas.compiled"
          export XDG_DATA_DIRS="$schemas" XDG_DATA_HOME="$schemas" GSETTINGS_SCHEMA_DIR="$schemas" GSETTINGS_BACKEND=memory
          gsettings get org.gtk.Settings.FileChooser show-hidden
          gsettings get org.gnome.desktop.interface color-scheme
          gsettings get org.gnome.system.proxy mode
      - uses: actions/upload-artifact@v4
        with:
          name: snap-install-test-inputs
          path: |
            dist/packages/*.snap
            dist/packages/joomengine-install-snap.sh
            dist/qa-snap/joomengine-install-snap.sh
          if-no-files-found: error
          retention-days: 7

  snap-install:
    name: Install the release Snap on a clean desktop (amd64)
    needs: snap
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snap-install-test-inputs
          path: dist
      - name: Prepare the disposable user's graphical session
        run: |
          .github/scripts/install-linux-build-deps.sh dbus-user-session
          for package in joomengine kde-qt6-core24; do
            if snap list "$package" >/dev/null 2>&1; then
              echo "The clean install test needs a runner without $package." >&2
              exit 1
            fi
          done
      - name: Reject damaged self-contained installers before any system change
        run: bash test/snap-installer.sh dist/packages/joomengine-install-snap.sh
      - name: Install and launch the release in a real user session
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          runtime="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          systemctl --user start dbus.socket
          (cd dist/packages && bash ./joomengine-install-snap.sh)
          # A Snapped shell uses the same command chain, base and providers
          # as the installed binary. The build VM can have extra libraries.
          systemd-run --user --wait --pipe --collect --quiet xvfb-run -a snap run --shell joomengine -c '
            set -eu
            failed=0
            for object in "$SNAP/usr/bin/joomengine" "$QTWEBENGINEPROCESS_PATH" \
              "$SNAP_DESKTOP_RUNTIME"/usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libq{xcb,wayland}.so; do
              test -f "$object"
              libraries=$(LD_TRACE_LOADED_OBJECTS=1 /lib64/ld-linux-x86-64.so.2 "$object")
              if [[ "$libraries" == *"=> not found"* ]]; then
                echo "$object has unresolved libraries:"
                echo "$libraries" | grep "=> not found"
                failed=1
              fi
            done
            exit "$failed"
          '
          systemd-run --user --wait --pipe --collect --quiet --working-directory="$PWD" \
            xvfb-run -a scripts/check-linux-window.sh /snap/bin/joomengine
      - name: Exercise Playground in the confined native QA build
        run: |
          # Upgrade the existing local install in place and prove shared user data survives.
          marker="$HOME/snap/joomengine/common/ci-upgrade-marker"
          test -d "$(dirname "$marker")"
          echo "$GITHUB_RUN_ID" > "$marker"
          (cd dist/qa-snap && bash ./joomengine-install-snap.sh)
          test "$(cat "$marker")" = "$GITHUB_RUN_ID"
          runtime="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          tmp="$HOME/snap/joomengine/common"
          mkdir -p "$tmp"
          systemd-run --user --wait --pipe --collect --quiet --working-directory="$PWD" \
            --setenv="TMPDIR=$tmp" xvfb-run -a python3 test/native_smoke.py --native-file-chooser /snap/bin/joomengine
      - name: Show Snap process and confinement diagnostics on failure
        if: failure()
        run: |
          snap connections joomengine || true
          sudo journalctl -k -b --no-pager | grep -Ei 'apparmor=|seccomp|segfault|trap' | grep -Ei 'joomengine|QtWebEngine' | tail -50 || true
          if command -v coredumpctl >/dev/null; then
            sudo coredumpctl --no-pager list --since '-30 min' | grep -Ei 'joomengine|QtWebEngine' || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-snap
          path: dist/packages/*.snap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-snap-installer
          path: dist/packages/joomengine-install-snap.sh
          if-no-files-found: error
