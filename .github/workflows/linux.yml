name: Native Linux packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  archive:
    name: Linux GTK archive (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and display dependencies
        run: .github/scripts/install-linux-build-deps.sh dbus-x11
      - name: Build the release and native QA binaries
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target joomengine --parallel
          cmake -S . -B build-qa -DCMAKE_BUILD_TYPE=Release -DJOOMENGINE_NATIVE_QA=ON
          cmake --build build-qa --target joomengine --parallel
      - name: Install and launch the release archive
        run: |
          bash scripts/package-linux.sh
          unpack=$(mktemp -d)
          tar -xzf dist/packages/*.tar.gz -C "$unpack"
          "$unpack"/JoomEngine-*/install.sh
          dbus-run-session -- xvfb-run -a scripts/check-linux-window.sh "$HOME/.local/bin/joomengine"
      - name: Exercise Playground in the native WebKitGTK engine
        run: dbus-run-session -- xvfb-run -a python3 test/native_smoke.py build-qa/joomengine
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/packages/*.tar.gz
          if-no-files-found: error

  snap:
    name: Native WebKitGTK Snap (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies on the disposable core24-compatible VM
        run: |
          .github/scripts/install-linux-build-deps.sh dbus-user-session
          sudo snap install --classic snapcraft
      - name: Build native release and QA executables
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target joomengine --parallel
          cmake -S . -B build-qa -DCMAKE_BUILD_TYPE=Release -DJOOMENGINE_NATIVE_QA=ON
          cmake --build build-qa --target joomengine --parallel
      - name: Package the release and instrumented test Snap
        run: |
          bash scripts/prepare-snap.sh
          mkdir -p dist/packages dist/qa-snap
          version=$(cat VERSION)
          # This hosted Ubuntu VM matches the core24 base. Build directly on
          # the disposable runner without downloading a separate LXD OS image.
          output="joomengine_${version}_amd64.snap"
          (cd dist/snap-project && sudo snapcraft pack --destructive-mode --output="$output")
          install -m 0644 "dist/snap-project/$output" dist/packages/
          # Keep the release output pristine. The second local Snap exercises
          # the same filesystem, native runtime and confinement with QA enabled.
          sudo install -m 0755 build-qa/joomengine dist/snap-project/prime/usr/bin/joomengine
          sudo snap pack dist/snap-project/prime dist/qa-snap
      - name: Install and launch the release in a real user session
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          runtime="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          systemctl --user start dbus.socket
          sudo snap install --dangerous dist/packages/*.snap
          test -x /snap/joomengine/current/gnome-platform/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebProcess || \
            test -x /snap/gnome-46-2404/current/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitWebProcess
          systemd-run --user --wait --pipe --collect --quiet --working-directory="$PWD" \
            xvfb-run -a scripts/check-linux-window.sh /snap/bin/joomengine
      - name: Exercise Playground in the confined native QA build
        run: |
          sudo snap remove --purge joomengine
          sudo snap install --dangerous dist/qa-snap/*.snap
          runtime="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          tmp="$HOME/snap/joomengine/common"
          mkdir -p "$tmp"
          systemd-run --user --wait --pipe --collect --quiet --working-directory="$PWD" \
            --setenv="TMPDIR=$tmp" xvfb-run -a python3 test/native_smoke.py /snap/bin/joomengine
      - uses: actions/upload-artifact@v4
        with:
          name: linux-snap
          path: dist/packages/*.snap
          if-no-files-found: error
