name: Windows MSIX

on:
  workflow_call:
    secrets:
      WINDOWS_PFX_BASE64:
        required: false
      WINDOWS_PFX_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build the native x64 application
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target joomengine
      - name: Ensure the Microsoft Evergreen WebView2 runtime is available
        shell: pwsh
        run: |
          $client = 'Microsoft/EdgeUpdate/Clients/{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:/SOFTWARE/WOW6432Node/$client", "HKCU:/SOFTWARE/$client")
          $installed = $keys | ForEach-Object {
            Get-ItemPropertyValue -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue
          } | Where-Object { [version]$_ -gt [version]'0.0.0.0' }
          if (-not $installed) {
            $setup = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'The WebView2 bootstrapper signature is invalid.'
            }
            $process = Start-Process $setup -ArgumentList '/silent', '/install' -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "WebView2 Evergreen setup failed ($($process.ExitCode))." }
          }
      - name: Build the x64 MSIX
        shell: pwsh
        env:
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
          WINDOWS_PFX_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_PFX_BASE64 || '' }}
          WINDOWS_PFX_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_PFX_PASSWORD || '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'joomengine-release.pfx'
          try {
            if ($env:WINDOWS_PFX_BASE64) {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
              $env:WINDOWS_PFX_PATH = $pfx
            }
            ./scripts/package-windows.ps1
          } finally {
            if (Test-Path $pfx) { Remove-Item -LiteralPath $pfx -Force }
          }
      - name: Install and launch the production MSIX
        shell: powershell
        run: |
          $msix = Get-Item 'dist/packages/*.msix'
          ./packaging/windows/test-package.ps1 -PackagePath $msix.FullName
      - name: Exercise the native WebView2 host with the live JCB site
        run: |
          cmake -S . -B build-qa -A x64 -DJOOMENGINE_NATIVE_QA=ON
          cmake --build build-qa --config Release --target joomengine
          python test/native_smoke.py build-qa/Release/JoomEngine.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: dist/packages/*.msix
          if-no-files-found: error
          compression-level: 0
