name: JoomEngine desktop
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Native navigation and release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check native window navigation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc test/policy.cpp -o "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/policy"
      - name: Check tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]

  linux:
    needs: checks
    uses: ./.github/workflows/linux.yml

  native-packages:
    needs: checks
    uses: ./.github/workflows/linux-native.yml

  portable-packages:
    needs: checks
    uses: ./.github/workflows/linux-portable.yml

  windows:
    needs: checks
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    needs: checks
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  downloads:
    name: Verify package set and generate SHA-256 downloads
    needs: [linux, native-packages, portable-packages, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/inputs
      - run: python3 scripts/release-assets.py "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/downloads"
      - uses: actions/upload-artifact@v4
        with:
          name: download-checksums
          path: ${{ runner.temp }}/downloads/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish verified GitHub downloads
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/inputs
      - name: Verify the same packages and the pinned upstream Qt source
        run: |
          inputs="$RUNNER_TEMP/inputs"
          downloads="$RUNNER_TEMP/downloads"
          python3 scripts/release-assets.py "$inputs" "$downloads"
          cmp "$inputs/download-checksums/SHA256SUMS" "$downloads/SHA256SUMS"
          python3 scripts/package-qt-notices.py --source-only "$downloads"
          (cd "$downloads" && sha256sum --check --strict SHA256SUMS)
      - name: Publish the complete release and installation guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$RUNNER_TEMP/downloads"

  linux-stores:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    uses: ./.github/workflows/linux-publish.yml

  microsoft-store:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.MICROSOFT_STORE_PUBLISH == 'true'
    needs: release
    uses: ./.github/workflows/microsoft-store.yml
