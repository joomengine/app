name: JoomEngine desktop
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Native navigation and release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check native window navigation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc test/policy.cpp -o "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/policy"
      - name: Check tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]

  linux:
    needs: checks
    uses: ./.github/workflows/linux.yml

  windows:
    needs: checks
    uses: ./.github/workflows/windows.yml
    secrets: inherit

  macos:
    needs: checks
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  release:
    name: Publish the tested installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Retrieve the corresponding source for the Qt libraries in the DMGs
        run: python3 scripts/package-qt-notices.py --source-only packages
      - name: Publish release files and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd packages
          shopt -s nullglob
          assets=(*.tar.gz *.snap *.msix *-arm64.dmg *-x64.dmg)
          [[ ${#assets[@]} -eq 5 ]]
          qt_source=(qt-everywhere-src-*.tar.xz)
          [[ ${#qt_source[@]} -eq 1 ]]
          assets+=("${qt_source[0]}")
          sha256sum "${assets[@]}" > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "JoomEngine ${GITHUB_REF_NAME#v}" --generate-notes "${assets[@]}" SHA256SUMS
          fi

  snap-store:
    name: Publish stable Snap
    if: vars.SNAP_STORE_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-snap
          path: packages
      - name: Locate tested Snap
        id: snap
        run: |
          shopt -s nullglob
          snaps=(packages/*.snap)
          [[ ${#snaps[@]} -eq 1 ]]
          echo "path=${snaps[0]}" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: stable
