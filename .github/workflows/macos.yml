name: macOS disk images

on:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build the system WebKit application
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Package disk image
        env:
          APPLE_CERTIFICATE_BASE64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: bash scripts/package-macos.sh
      - name: Copy JoomEngine from its disk image and launch it
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image=(dist/packages/*.dmg)
          [[ "${#image[@]}" == 1 ]]
          mount="$RUNNER_TEMP/JoomEngine volume"
          install="$RUNNER_TEMP/Installed apps"
          mkdir -p "$mount" "$install"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${image[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/JoomEngine.app" "$install/JoomEngine.app"
          hdiutil detach "$mount"
          trap - EXIT
          app="$install/JoomEngine.app"
          codesign --verify --deep --strict "$app"
          binary="$app/Contents/MacOS/JoomEngine"
          arch="$EXPECTED_ARCH"
          if [[ "$arch" == x64 ]]; then arch=x86_64; fi
          lipo "$binary" -verify_arch "$arch"
          otool -L "$binary" | grep '/System/Library/Frameworks/WebKit.framework/'
          "$binary" &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
          trap - EXIT
      - name: Exercise live JCB in the native WebKit host
        run: |
          cmake -S . -B build-qa -DJOOMENGINE_NATIVE_QA=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qa --config Release --parallel
          codesign --force --sign - --timestamp=none build-qa/JoomEngine.app
          python3 test/native_smoke.py build-qa/JoomEngine.app/Contents/MacOS/JoomEngine
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/packages/*.dmg
          if-no-files-found: error
          compression-level: 0
