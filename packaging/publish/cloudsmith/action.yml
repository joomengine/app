name: Publish a verified distribution package
description: Upload the public release asset to a signed Cloudsmith APT or RPM repository.
inputs:
  format:
    description: Cloudsmith package format (deb or rpm)
    required: true
  distribution:
    description: Cloudsmith distribution and release (for example debian/trixie)
    required: true
  namespace:
    description: Cloudsmith workspace slug
    required: true
  repository:
    description: Cloudsmith repository slug
    required: true
  api-key:
    description: Cloudsmith service API key with write access
    required: true
  github-token:
    description: Read-only token for the public GitHub release
    required: true
runs:
  using: composite
  steps:
    - name: Download and verify the release package
      shell: bash
      id: asset
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        FORMAT: ${{ inputs.format }}
      run: |
        file=$(packaging/publish/release-file.sh "*.$FORMAT")
        echo "path=$file" >> "$GITHUB_OUTPUT"
    - name: Install the Cloudsmith upload client
      shell: bash
      run: pipx install 'cloudsmith-cli==1.31.3'
    - name: Upload to the package repository
      shell: bash
      env:
        PACKAGE_FILE: ${{ steps.asset.outputs.path }}
        FORMAT: ${{ inputs.format }}
        DISTRIBUTION: ${{ inputs.distribution }}
        NAMESPACE: ${{ inputs.namespace }}
        REPOSITORY: ${{ inputs.repository }}
        CLOUDSMITH_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        : "${CLOUDSMITH_API_KEY:?Set CLOUDSMITH_API_KEY in the distribution environment.}"
        [[ "$NAMESPACE" =~ ^[a-zA-Z0-9_-]+$ && "$REPOSITORY" =~ ^[a-zA-Z0-9_-]+$ ]]
        digest=$(sha256sum "$PACKAGE_FILE")
        digest=${digest%% *}
        # RPM signing can change the package bytes after upload. Record the
        # GitHub release digest on the package for safe retries across channels.
        existing=$(curl --fail --silent --show-error --retry 3 --get \
          "https://api.cloudsmith.io/packages/$NAMESPACE/$REPOSITORY/" \
          --data-urlencode "query=tag:$digest format:$FORMAT distribution:$DISTRIBUTION")
        jq -e 'type == "array"' <<<"$existing" >/dev/null
        if jq -e 'any(.[]; .is_sync_completed and .is_downloadable and (.is_sync_failed | not))' <<<"$existing" >/dev/null; then
          echo "The verified package is already published."
          exit 0
        fi
        if jq -e 'length > 0' <<<"$existing" >/dev/null; then
          echo "Cloudsmith already has this upload. Inspect its sync status and resync the package before retrying." >&2
          exit 1
        fi
        cloudsmith push "$FORMAT" "$NAMESPACE/$REPOSITORY/$DISTRIBUTION" "$PACKAGE_FILE" --tags "$digest"
