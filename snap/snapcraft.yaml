name: joomengine
title: JoomEngine
base: core24
adopt-info: application
summary: Build Joomla extensions with JoomEngine Playground
description: |
  Run the JCB development workspace on your desktop with persistent sites,
  detached tool windows and project downloads using Qt WebEngine.
website: https://playground.joomengine.org/
source-code: https://github.com/joomengine/joomengine
issues: https://github.com/joomengine/joomengine/issues
contact: https://github.com/joomengine/joomengine/issues
license: Apache-2.0
grade: stable
confinement: strict
platforms:
  amd64:

plugs:
  browser-support:
    interface: browser-support
    allow-sandbox: true

layout:
  /etc/fonts:
    bind: $SNAP/etc/fonts
  /usr/share/fontconfig:
    bind: $SNAP/usr/share/fontconfig

parts:
  desktop-schemas:
    plugin: nil
    build-packages: [libglib2.0-bin]
    stage-packages: [gsettings-desktop-schemas, libgtk-3-common]
    override-build: |
      craftctl default
      schemas="$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas"
      glib-compile-schemas --strict "$schemas"
    stage:
      - usr/share/glib-2.0/schemas/gschemas.compiled
      - usr/share/doc/gsettings-desktop-schemas/copyright
      - usr/share/doc/libgtk-3-common/copyright

  application:
    plugin: dump
    source: payload
    # Complete the shared Qt runtime's networking, XCB and image dependencies.
    # The strict base has a smaller set of libraries than the build SDK.
    stage-packages:
      - fontconfig-config
      - libfribidi0
      - liblerc4
      - libnghttp2-14
      - libpsl5t64
      - librtmp1
      - libsasl2-2
      - libsharpyuv0
      - libsnappy1v5
      - libssh-4
      - libxcb-shape0
    override-pull: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/VERSION")"

apps:
  joomengine:
    command: usr/bin/launch-joomengine
    extensions: [kde-neon-qt6]
    plugs: [browser-support, hardware-observe, home]
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
      XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
      XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
