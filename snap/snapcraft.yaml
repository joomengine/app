name: joomengine
title: JoomEngine
base: core24
adopt-info: application
summary: Build Joomla extensions with JoomEngine Playground
description: |
  Run the JCB development workspace on your desktop with persistent sites,
  detached tool windows and project downloads using native WebKitGTK.
website: https://playground.joomengine.org/
source-code: https://github.com/joomengine/app
issues: https://github.com/joomengine/app/issues
license: Apache-2.0
grade: stable
confinement: strict
platforms:
  amd64:

slots:
  workspace-bus:
    interface: dbus
    bus: session
    name: org.joomengine.app

parts:
  application:
    plugin: dump
    source: payload
    override-pull: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PROJECT_DIR/VERSION")"

apps:
  joomengine:
    command: usr/bin/joomengine
    # core24's GNOME runtime contains the matching library, WebKitWebProcess
    # and WebKitNetworkProcess and mounts their expected absolute paths.
    extensions: [gnome]
    slots: [workspace-bus]
    plugs: [audio-playback, browser-support, home, network]
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_COMMON/.config
      XDG_CACHE_HOME: $SNAP_USER_COMMON/.cache
      XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share
